<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="50%" stop-color="#134e4a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="50%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad)" />
  <circle cx="400" cy="220" r="280" fill="url(#glow)" />

  <!-- Outer Border -->
  <rect x="24" y="24" width="752" height="452" rx="12" fill="none" stroke="#115e59" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6" />
  <rect x="36" y="36" width="728" height="428" rx="8" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.8" />

  <!-- Organization Badge -->
  <g transform="translate(400, 95)">
    <rect x="-130" y="-18" width="260" height="36" rx="18" fill="#134e4a" stroke="#2dd4bf" stroke-width="1" />
    <text text-anchor="middle" y="6" fill="#99f6e4" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="2">CLOUD SYSTEMS ACADEMY</text>
  </g>

  <!-- Certificate Heading -->
  <text text-anchor="middle" x="400" y="165" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="3" text-transform="uppercase" opacity="0.75">PROFESSIONAL ARCHITECT CERTIFICATION</text>

  <!-- Course Title -->
  <text text-anchor="middle" x="400" y="215" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800">Cloud Systems Architecture &amp; Scale</text>

  <!-- Awarded to -->
  <text text-anchor="middle" x="400" y="260" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Awarded to</text>
  <text text-anchor="middle" x="400" y="295" fill="url(#accentGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800">Anas Al Dahamsheh</text>

  <!-- Skills / Subtitle -->
  <text text-anchor="middle" x="400" y="340" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="13">Microservices • Container Orchestration • PostgreSQL Scale • High Availability</text>

  <!-- Footer Seal and Details -->
  <g transform="translate(160, 415)">
    <text text-anchor="start" x="0" y="0" fill="#5eead4" font-family="system-ui, -apple-system, sans-serif" font-size="11">ISSUE DATE</text>
    <text text-anchor="start" x="0" y="18" fill="#f0fdfa" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">December 2023</text>
  </g>

  <g transform="translate(400, 415)">
    <circle cx="0" cy="5" r="22" fill="#134e4a" stroke="url(#accentGrad)" stroke-width="2" />
    <polygon points="0,-7 5,3 -5,3" fill="#2dd4bf" />
    <polygon points="0,17 5,7 -5,7" fill="#2dd4bf" />
  </g>

  <g transform="translate(640, 415)">
    <text text-anchor="end" x="0" y="0" fill="#5eead4" font-family="system-ui, -apple-system, sans-serif" font-size="11">CREDENTIAL ID</text>
    <text text-anchor="end" x="0" y="18" fill="#f0fdfa" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">CSA-SCALE-2023-5519</text>
  </g>
</svg>
