<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad)" />
  <circle cx="400" cy="220" r="280" fill="url(#glow)" />

  <!-- Outer Border -->
  <rect x="24" y="24" width="752" height="452" rx="12" fill="none" stroke="#3f3f46" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6" />
  <rect x="36" y="36" width="728" height="428" rx="8" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.8" />

  <!-- Organization Badge -->
  <g transform="translate(400, 95)">
    <rect x="-120" y="-18" width="240" height="36" rx="18" fill="#27272a" stroke="#52525b" stroke-width="1" />
    <text text-anchor="middle" y="6" fill="#fde68a" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="2">STANFORD ONLINE</text>
  </g>

  <!-- Certificate Heading -->
  <text text-anchor="middle" x="400" y="165" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="3" text-transform="uppercase" opacity="0.75">SPECIALIZATION CERTIFICATE</text>

  <!-- Course Title -->
  <text text-anchor="middle" x="400" y="215" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800">Machine Learning &amp; Deep Neural Networks</text>

  <!-- Awarded to -->
  <text text-anchor="middle" x="400" y="260" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Awarded to</text>
  <text text-anchor="middle" x="400" y="295" fill="url(#accentGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800">Anas Al Dahamsheh</text>

  <!-- Skills / Subtitle -->
  <text text-anchor="middle" x="400" y="340" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="13">Supervised Learning • Deep Neural Nets • Backpropagation • Optimization Algorithms</text>

  <!-- Footer Seal and Details -->
  <g transform="translate(160, 415)">
    <text text-anchor="start" x="0" y="0" fill="#71717a" font-family="system-ui, -apple-system, sans-serif" font-size="11">ISSUE DATE</text>
    <text text-anchor="start" x="0" y="18" fill="#e4e4e7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">August 2023</text>
  </g>

  <g transform="translate(400, 415)">
    <circle cx="0" cy="5" r="22" fill="#27272a" stroke="url(#accentGrad)" stroke-width="2" />
    <polygon points="0,-7 5,3 -5,3" fill="#f59e0b" />
    <polygon points="0,17 5,7 -5,7" fill="#f59e0b" />
  </g>

  <g transform="translate(640, 415)">
    <text text-anchor="end" x="0" y="0" fill="#71717a" font-family="system-ui, -apple-system, sans-serif" font-size="11">CREDENTIAL ID</text>
    <text text-anchor="end" x="0" y="18" fill="#e4e4e7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">STANFORD-ML-7819</text>
