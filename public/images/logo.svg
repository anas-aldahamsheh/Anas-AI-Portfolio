<svg xmlns="http://www.w3.org/2000/svg" viewBox="110 110 1100 290" role="img" aria-labelledby="title desc">
  <title id="title">Anas Al Dahamsheh — AI Engineer Logo</title>
  <desc id="desc">Minimal personal brand logo with an AD monogram, name, blue divider, and AI Engineer subtitle.</desc>

  <defs>
    <style>
      .brand-title { fill: #0B1530; }
      .brand-subtitle { fill: #6B7C99; }
      .monogram-d { fill: #0B1530; }
      @media (prefers-color-scheme: dark) {
        .brand-title { fill: #F8FAFC; }
        .brand-subtitle { fill: #9AA8C0; }
        .monogram-d { fill: #F8FAFC; }
      }
    </style>
    <linearGradient id="adBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#153B8F"/>
      <stop offset="100%" stop-color="#0B1530"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2F6FED"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- Main name -->
  <text class="brand-title" x="120" y="200"
        font-family="Inter, Segoe UI, Arial, sans-serif"
        font-size="108"
        font-weight="800"
        letter-spacing="-3">
    Anas Al Dahamsheh
  </text>

  <!-- AD monogram -->
  <g transform="translate(120 245)">
    <!-- A -->
    <path d="M18 128 L74 18 H103 L158 128 H126 L114 102 H62 L50 128 Z
             M74 77 H103 L89 47 Z"
          fill="url(#adBlue)"/>

    <!-- D -->
    <path class="monogram-d"
          d="M118 18 H171
             C215 18 244 41 244 73
             C244 105 215 128 171 128
             H118 V101 H168
             C195 101 211 90 211 73
             C211 56 195 45 168 45
             H118 Z"/>

    <!-- Accent slash inside monogram -->
    <path d="M79 128 L104 79 H128 L103 128 Z"
          fill="url(#accentBlue)"/>
  </g>

  <!-- Divider -->
  <rect x="405" y="286" width="12" height="106" rx="6" fill="url(#accentBlue)"/>

  <!-- Subtitle -->
  <text class="brand-subtitle" x="465" y="365"
        font-family="Inter, Segoe UI, Arial, sans-serif"
        font-size="78"
        font-weight="500">
    AI Engineer
  </text>
</svg>
