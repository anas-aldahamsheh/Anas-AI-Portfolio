<svg xmlns="http://www.w3.org/2000/svg" viewBox="25 95 1400 270" role="img" aria-labelledby="title desc">
  <title id="title">Anas Al Dahamsheh — AI Engineer</title>
  <desc id="desc">Transparent high-quality vector logo with AD monogram, name, and AI Engineer subtitle.</desc>

  <defs>
    <style>
      .brand-title { fill: #0B1530; }
      .brand-subtitle { fill: #6B7C99; }
      @media (prefers-color-scheme: dark) {
        .brand-title { fill: #F8FAFC; }
        .brand-subtitle { fill: #9AA8C0; }
      }
    </style>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="55%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0B1530"/>
    </linearGradient>
    <linearGradient id="blueBright" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- AD monogram -->
  <g transform="translate(40 88)">
    <!-- Stylized A -->
    <path d="M0 230 L118 18 H154 L274 230 H224 L198 181 H75 L49 230 Z"
          fill="url(#blueGrad)"/>
    <!-- Inner cut / counter -->
    <path d="M103 139 L136 80 L168 139 Z" fill="white" opacity="0"/>
    <!-- Stylized D -->
    <path d="M146 18 H229
             C294 18 337 58 337 124
             C337 190 294 230 229 230
             H146 V184 H222
             C265 184 289 162 289 124
             C289 86 265 64 222 64
             H146 Z"
          fill="url(#blueGrad)"/>
    <!-- Accent wedge -->
    <path d="M96 230 L131 168 H163 L129 230 Z" fill="#2F6FED"/>
  </g>

  <!-- Name -->
  <text class="brand-title" x="420" y="220"
        font-family="Inter, Arial, Helvetica, sans-serif"
        font-size="104"
        font-weight="800"
        letter-spacing="-3">
    Anas Al Dahamsheh
  </text>

  <!-- Accent divider -->
  <rect x="420" y="280" width="165" height="12" rx="6" fill="url(#blueBright)"/>

  <!-- Subtitle -->
  <text class="brand-subtitle" x="620" y="340"
        font-family="Inter, Arial, Helvetica, sans-serif"
        font-size="72"
        font-weight="500"
        letter-spacing="2">
    AI Engineer
  </text>
</svg>
