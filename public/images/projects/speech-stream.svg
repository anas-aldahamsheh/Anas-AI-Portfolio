<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-speech" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a09" />
      <stop offset="50%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-grad-speech)" />

  <!-- Animated-like waveform bars in center -->
  <g transform="translate(150, 225)">
    <!-- Bar sequence representing audio processing -->
    <rect x="0" y="-30" width="8" height="60" rx="4" fill="#06b6d4" />
    <rect x="16" y="-55" width="8" height="110" rx="4" fill="#06b6d4" />
    <rect x="32" y="-20" width="8" height="40" rx="4" fill="#06b6d4" />
    <rect x="48" y="-70" width="8" height="140" rx="4" fill="#10b981" />
    <rect x="64" y="-90" width="8" height="180" rx="4" fill="#10b981" />
    <rect x="80" y="-45" width="8" height="90" rx="4" fill="#10b981" />
    <rect x="96" y="-75" width="8" height="150" rx="4" fill="#3b82f6" />
    <rect x="112" y="-105" width="8" height="210" rx="4" fill="#3b82f6" />
    <rect x="128" y="-60" width="8" height="120" rx="4" fill="#3b82f6" />
    <rect x="144" y="-35" width="8" height="70" rx="4" fill="#6366f1" />
    <rect x="160" y="-85" width="8" height="170" rx="4" fill="#6366f1" />
    <rect x="176" y="-115" width="8" height="230" rx="4" fill="#8b5cf6" />
    <rect x="192" y="-70" width="8" height="140" rx="4" fill="#8b5cf6" />
    <rect x="208" y="-40" width="8" height="80" rx="4" fill="#a855f7" />
    <rect x="224" y="-95" width="8" height="190" rx="4" fill="#a855f7" />
    <rect x="240" y="-55" width="8" height="110" rx="4" fill="#d946ef" />
    <rect x="256" y="-25" width="8" height="50" rx="4" fill="#d946ef" />
  </g>

  <!-- Metrics callout -->
  <rect x="450" y="150" width="220" height="150" rx="14" fill="#18181b" stroke="#3f3f46" stroke-width="1.5" />
  <text x="560" y="190" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="600">AUDIO-TO-AUDIO</text>
  <text x="560" y="225" fill="#34d399" font-family="system-ui, sans-serif" font-size="28" text-anchor="middle" font-weight="800">&lt; 150ms</text>
  <text x="560" y="255" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Bidirectional WebRTC Stream</text>
  <text x="560" y="278" fill="#71717a" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Bilingual VAD &amp; Neural TTS</text>

  <rect x="40" y="35" width="240" height="32" rx="8" fill="#18181b" fill-opacity="0.8" stroke="#3f3f46" stroke-width="1" />
  <text x="55" y="56" fill="#a855f7" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Neural Speech Stream Pipeline</text>
</svg>
