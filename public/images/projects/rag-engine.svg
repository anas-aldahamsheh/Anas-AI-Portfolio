<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-rag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-grad-rag)" />
  <!-- Grid lines -->
  <g stroke="#334155" stroke-opacity="0.25" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="450" />
    <line x1="250" y1="0" x2="250" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="550" y1="0" x2="550" y2="450" />
    <line x1="700" y1="0" x2="700" y2="450" />
    <line x1="0" y1="75" x2="800" y2="75" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="225" x2="800" y2="225" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="375" x2="800" y2="375" />
  </g>
  <!-- Architecture Diagram Elements -->
  <!-- Document Ingestion Node -->
  <rect x="120" y="160" width="130" height="130" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 2" />
  <text x="185" y="210" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="600">INPUT CHUNKS</text>
  <text x="185" y="235" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle" font-weight="700">Multimodal Docs</text>

  <!-- Flow line 1 -->
  <path d="M 250 225 L 340 225" stroke="url(#cyan-glow)" stroke-width="2" marker-end="url(#arrow)" />
  <circle cx="295" cy="225" r="4" fill="#38bdf8" filter="url(#glow)" />

  <!-- Hybrid Search & Vector Core -->
  <rect x="340" y="125" width="160" height="200" rx="16" fill="#0f172a" stroke="#818cf8" stroke-width="2" />
  <rect x="355" y="145" width="130" height="40" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
  <text x="420" y="170" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="600">Dense (BGE-M3)</text>
  <rect x="355" y="195" width="130" height="40" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
  <text x="420" y="220" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="600">Sparse Lexical</text>
  <rect x="355" y="245" width="130" height="60" rx="8" fill="#312e81" stroke="#a5b4fc" stroke-width="1.5" />
  <text x="420" y="270" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">RRF Fusion</text>
  <text x="420" y="290" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle" font-weight="700">Rerank Engine</text>

  <!-- Flow line 2 -->
  <path d="M 500 225 L 590 225" stroke="url(#cyan-glow)" stroke-width="2" />
  <circle cx="545" cy="225" r="4" fill="#818cf8" filter="url(#glow)" />

  <!-- Grounded Output Node -->
  <rect x="590" y="160" width="140" height="130" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
  <text x="660" y="205" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="700">99.4% CITATION</text>
  <text x="660" y="230" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle" font-weight="700">Grounded Answer</text>
  <text x="660" y="255" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">180ms P95 Latency</text>

  <!-- Title overlay on top left -->
  <rect x="40" y="35" width="220" height="32" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1" />
  <text x="55" y="56" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Autonomous RAG Architecture</text>
</svg>
