<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-policy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#141c2e" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-grad-policy)" />
  <g stroke="#1e293b" stroke-opacity="0.5" stroke-width="1">
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="300" x2="800" y2="300" />
  </g>
  <!-- Edge nodes network -->
  <circle cx="200" cy="225" r="45" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
  <text x="200" y="220" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="700">EDGE INGRESS</text>
  <text x="200" y="238" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">50k req/sec</text>

  <path d="M 245 225 L 340 225" stroke="url(#amber-glow)" stroke-width="2" stroke-dasharray="3 3" />

  <!-- Policy Consensus Hub -->
  <rect x="340" y="140" width="180" height="170" rx="14" fill="#0f172a" stroke="#3b82f6" stroke-width="2" />
  <rect x="360" y="160" width="140" height="35" rx="6" fill="#1e293b" />
  <text x="430" y="182" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="600">Rust Tokio Runtime</text>
  <rect x="360" y="205" width="140" height="35" rx="6" fill="#1e293b" />
  <text x="430" y="227" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="600">Ed25519 Cryptography</text>
  <rect x="360" y="250" width="140" height="40" rx="6" fill="#1d4ed8" />
  <text x="430" y="275" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="700">&lt; 3ms P99 Decision</text>

  <path d="M 520 225 L 610 225" stroke="#10b981" stroke-width="2" />

  <!-- Authorized Service Ring -->
  <circle cx="650" cy="225" r="45" fill="#1e293b" stroke="#10b981" stroke-width="2" />
  <text x="650" y="220" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="700">SERVICE RING</text>
  <text x="650" y="238" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Zero Alloc</text>

  <rect x="40" y="35" width="230" height="32" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1" />
  <text x="55" y="56" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Edge Gateway &amp; Policy Consensus</text>
</svg>
