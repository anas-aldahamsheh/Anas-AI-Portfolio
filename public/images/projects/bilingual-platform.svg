<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-bilingual" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-grad-bilingual)" />

  <!-- Split screen comparison representing bilingual layout -->
  <!-- Left Side: English LTR -->
  <rect x="120" y="130" width="260" height="190" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <rect x="140" y="150" width="100" height="12" rx="4" fill="#38bdf8" />
  <rect x="140" y="175" width="180" height="8" rx="3" fill="#64748b" />
  <rect x="140" y="195" width="220" height="8" rx="3" fill="#475569" />
  <rect x="140" y="215" width="160" height="8" rx="3" fill="#475569" />
  <rect x="140" y="245" width="70" height="24" rx="6" fill="#0284c7" />
  <text x="140" y="295" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Left-to-Right (LTR)</text>

  <!-- Right Side: Arabic RTL -->
  <rect x="420" y="130" width="260" height="190" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <rect x="560" y="150" width="100" height="12" rx="4" fill="#38bdf8" />
  <rect x="480" y="175" width="180" height="8" rx="3" fill="#64748b" />
  <rect x="440" y="195" width="220" height="8" rx="3" fill="#475569" />
  <rect x="500" y="215" width="160" height="8" rx="3" fill="#475569" />
  <rect x="590" y="245" width="70" height="24" rx="6" fill="#0284c7" />
  <text x="660" y="295" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="end">Right-to-Left (RTL)</text>

  <rect x="40" y="35" width="240" height="32" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
  <text x="55" y="56" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">WCAG 2.2 AA Bilingual Engine</text>
</svg>
